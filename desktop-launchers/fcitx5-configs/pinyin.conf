# 拼音引擎优化配置

# 候选词数量（默认 5，加到 9 输入更高效，不用翻页）
PageSize=9

# 启用逐字提示（输入"ni"能看到"你/尼/拟..."，避免切分错误）
ShuangpinMode=False

# 预测（输入时预测下一个字，类似手机输入法）
Prediction=True

# 模糊音（按需启用，zh/z, sh/s, ch/c 等南方口音友好）
# 取消下面注释启用需要的模糊音
# FuzzyRule=zh=>z
# FuzzyRule=sh=>s
# FuzzyRule=ch=>c
# FuzzyRule=n=>l
# FuzzyRule=l=>n

# 标点配对（自动转中文标点）
Chaizi=True

# 云拼音候选词位置（第二位，第一位留给精确匹配）
CloudPinyinEnabled=True

# 记忆用户词频（越用越准）
LearningEnabled=True

# 数字选词时按 Enter 直接上屏第一个（不是上屏空格）
# 默认空格上屏第一个，保持默认
